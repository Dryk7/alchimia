<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0709">
<title>ALCHIMIA — Le Cabinet des Trois Voies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&family=VT323&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ALCHIMIA v2 — DA Maximum
   - palette gothique-alchimique, 5 familles (or, parchemin, plante, pierre, essence)
   - 32×32 sprites SVG pixel art
   - canvas : poussière + bougies + bulles cauldron + FX de fusion
   - cinématique Grand Œuvre
   - aucun emoji : tout est SVG inline
   ========================================================= */
:root{
  --ink:#070506;
  --ink-2:#0e0a0c;
  --shadow:#1a1318;
  --panel:#1f1620;
  --panel-2:#2a1f24;
  --leather:#3d2a24;

  --parchment:#d8c69a;
  --parchment-2:#b8a072;
  --parchment-3:#8a7048;

  --gold-dark:#5a4528;
  --gold:#9a7842;
  --gold-light:#c9a25a;
  --gold-bright:#e8c878;
  --gold-glow:rgba(232,200,120,.4);

  --plant:#5a8a4a;
  --plant-2:#7ab36a;
  --plant-glow:rgba(140,210,120,.6);

  --mineral:#4a6a8a;
  --mineral-2:#7aa3c8;
  --mineral-glow:rgba(140,200,240,.6);

  --essence:#6a4a8a;
  --essence-2:#a070d0;
  --essence-glow:rgba(180,120,240,.6);

  --ember:#c84a2a;
  --flame:#e8a050;
  --flame-glow:rgba(232,160,80,.55);

  --blood:#8a2a2a;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:"IM Fell English", Georgia, serif;
  font-size:15px; line-height:1.4;
  user-select:none; -webkit-user-select:none;
  touch-action:none;
}

/* ================ FOND : table en bois sombre + ambiance ================ */
#stage{
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 50% 30% at 18% 4%, rgba(232,160,80,.13), transparent 60%),
    radial-gradient(ellipse 50% 30% at 82% 4%, rgba(232,160,80,.13), transparent 60%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(120,80,40,.18), transparent 70%),
    radial-gradient(ellipse 110% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.78) 100%),
    repeating-linear-gradient(91deg,
      #1a0f0a 0px, #1a0f0a 2px,
      #150c08 2px, #150c08 4px,
      #1d110b 4px, #1d110b 7px,
      #160d09 7px, #160d09 10px),
    #120906;
  display:flex; flex-direction:column;
}

/* couches canvas plein-écran */
#dust{position:fixed; inset:0; pointer-events:none; z-index:2}
#candles{position:fixed; inset:0; pointer-events:none; z-index:3}
#fx{position:fixed; inset:0; pointer-events:none; z-index:55}
#cinema{position:fixed; inset:0; pointer-events:none; z-index:90}

/* grain de parchemin global, très subtil */
#stage::after{
  content:""; position:absolute; inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.9   0 0 0 0 0.78   0 0 0 0 0.55   0 0 0 0.13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity:.18; mix-blend-mode:overlay; pointer-events:none;
}

/* ================ HEADER ================ */
header{
  position:relative; z-index:5;
  padding:8px 12px 6px;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:8px;
  align-items:center;
  border-bottom:1px solid var(--gold-dark);
  background:linear-gradient(180deg, rgba(20,14,18,.96), rgba(20,14,18,.6));
  box-shadow:0 8px 20px -10px #000;
}
.brand{display:flex; align-items:center; gap:8px}
.brand .fleur{width:18px; height:18px; color:var(--gold); flex-shrink:0; opacity:.9}
.brand .name{
  font-family:"Cinzel", serif; font-weight:900;
  letter-spacing:.20em; font-size:15px;
  color:var(--gold-bright);
  text-shadow:0 0 12px var(--gold-glow), 0 1px 0 #000;
  line-height:1;
}
.brand .name small{
  display:block; font-family:"Cormorant Garamond", serif;
  font-style:italic; font-weight:500; font-size:9px;
  letter-spacing:.28em; color:var(--gold); opacity:.7;
  margin-top:2px;
}

.stats{display:flex; gap:8px; justify-content:flex-end; align-items:center}
.stat{
  display:flex; align-items:center; gap:5px;
  padding:4px 8px;
  background:linear-gradient(180deg, #1a1014, #0e0708);
  border:1px solid var(--gold-dark);
  border-radius:2px;
  font-family:"VT323", monospace;
  font-size:18px; line-height:1;
  color:var(--gold-bright);
  text-shadow:0 0 6px var(--gold-glow);
  min-width:70px;
  position:relative;
}
.stat::before, .stat::after{
  content:""; position:absolute; width:5px; height:5px;
  border:1px solid var(--gold);
}
.stat::before{top:-1px; left:-1px; border-right:none; border-bottom:none}
.stat::after{bottom:-1px; right:-1px; border-left:none; border-top:none}
.stat .icon{width:16px; height:16px; display:inline-block; flex-shrink:0}

/* ================ GAME ================ */
#play{
  flex:1;
  display:flex; flex-direction:column;
  position:relative; z-index:4;
  padding:6px 6px 8px;
  gap:8px;
  min-height:0;
}

#grid-wrap{
  flex:1;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  min-height:0;
  padding:6px;
}
#grid-frame{
  position:relative;
  background:
    radial-gradient(ellipse 70% 50% at 50% 50%, rgba(232,200,120,.07), transparent 70%),
    linear-gradient(180deg, #1a1218, #0d090c);
  border:2px solid var(--gold-dark);
  border-radius:3px;
  padding:8px;
  width:min(94vw, calc((100vh - 280px) * 5 / 6));
  aspect-ratio: 5 / 6;
  max-width:520px;
  box-shadow:
    inset 0 0 30px rgba(0,0,0,.7),
    inset 0 0 0 1px rgba(232,200,120,.08),
    0 0 0 1px var(--ink),
    0 0 0 2px var(--gold-dark),
    0 10px 40px rgba(0,0,0,.6);
}
/* Coins ornementés baroques (SVG décoratif) */
.frame-corner{
  position:absolute; width:22px; height:22px;
  color:var(--gold); pointer-events:none;
  filter:drop-shadow(0 0 4px var(--gold-glow));
}
.frame-corner.tl{top:-9px; left:-9px}
.frame-corner.tr{top:-9px; right:-9px; transform:scaleX(-1)}
.frame-corner.bl{bottom:-9px; left:-9px; transform:scaleY(-1)}
.frame-corner.br{bottom:-9px; right:-9px; transform:scale(-1,-1)}

#grid{
  display:grid;
  gap:4px;
  position:relative;
  width:100%; height:100%;
}
.cell{
  position:relative;
  aspect-ratio:1/1;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(232,200,120,.04), transparent 70%),
    linear-gradient(180deg, #0a0608, #050304);
  border:1px solid #2a1f24;
  border-radius:2px;
  box-shadow:inset 0 1px 0 rgba(232,200,120,.05), inset 0 -1px 2px rgba(0,0,0,.5);
}
.cell.drop{
  border-color:var(--gold-bright);
  box-shadow:
    inset 0 0 0 1px var(--gold-bright),
    inset 0 0 12px var(--gold-glow),
    0 0 12px var(--gold-glow);
}
.cell.merge-target{
  border-color:#fff;
  box-shadow:
    inset 0 0 0 1px #fff,
    inset 0 0 16px #fff,
    0 0 18px #fff;
}
.cell.flash{
  animation:cellFlash .35s ease-out;
}
@keyframes cellFlash{
  0%{box-shadow:inset 0 0 0 0 #fff}
  50%{box-shadow:inset 0 0 24px #fff, 0 0 24px #fff}
  100%{box-shadow:inset 0 0 0 0 transparent}
}

.tile{
  position:absolute; inset:2px;
  display:flex; align-items:center; justify-content:center;
  cursor:grab;
  transition:transform .14s cubic-bezier(.2,.9,.2,1.4), filter .2s, opacity .2s;
  will-change:transform;
}
.tile.dragging{cursor:grabbing; z-index:60; transition:none; filter:brightness(1.15) drop-shadow(0 4px 8px #000)}
.tile.spawn{animation:spawn .42s cubic-bezier(.2,.9,.2,1.4)}
.tile.merge-out{animation:mergeOut .25s ease-in forwards}
.tile.merge-in{animation:mergeIn .55s cubic-bezier(.2,.9,.2,1.4)}
.tile svg{width:90%; height:90%; image-rendering:pixelated; filter:drop-shadow(0 1px 0 #000)}
.tile .tier-badge{
  position:absolute; bottom:-2px; right:-2px;
  font-family:"Cinzel", serif; font-weight:700;
  font-size:8px; letter-spacing:.05em;
  color:var(--gold-bright);
  background:#000;
  border:1px solid var(--gold-dark);
  padding:0 3px;
  line-height:1.2;
  text-shadow:0 0 3px var(--gold-glow);
}
.tile[data-chain="0"] svg{filter:drop-shadow(0 0 5px var(--plant-glow)) drop-shadow(0 1px 0 #000)}
.tile[data-chain="1"] svg{filter:drop-shadow(0 0 5px var(--mineral-glow)) drop-shadow(0 1px 0 #000)}
.tile[data-chain="2"] svg{filter:drop-shadow(0 0 5px var(--essence-glow)) drop-shadow(0 1px 0 #000)}
.tile[data-tier="3"] svg{animation:halo3 2.6s ease-in-out infinite}
.tile[data-tier="4"] svg{animation:halo4 2.4s ease-in-out infinite}
.tile[data-tier="5"]{animation:floaty 3.2s ease-in-out infinite}
.tile[data-tier="5"] svg{animation:halo5 2.0s ease-in-out infinite}
.tile[data-tier="6"]{animation:floaty 2.8s ease-in-out infinite}
.tile[data-tier="6"] svg{animation:halo6 1.8s ease-in-out infinite}
.tile[data-tier="7"]{animation:floaty7 2.4s ease-in-out infinite}
.tile[data-tier="7"] svg{animation:halo7 1.5s ease-in-out infinite}
.tile[data-tier="6"] .tier-badge,
.tile[data-tier="7"] .tier-badge{
  background:linear-gradient(180deg, #c9a25a, #5a4528);
  color:#000; border-color:#fff;
  box-shadow:0 0 8px var(--gold-bright);
}

@keyframes halo3{0%,100%{filter:drop-shadow(0 0 6px currentColor) drop-shadow(0 1px 0 #000)} 50%{filter:drop-shadow(0 0 10px currentColor) drop-shadow(0 1px 0 #000)}}
@keyframes halo4{0%,100%{filter:drop-shadow(0 0 8px currentColor) drop-shadow(0 1px 0 #000)} 50%{filter:drop-shadow(0 0 14px currentColor) drop-shadow(0 1px 0 #000)}}
@keyframes halo5{0%,100%{filter:drop-shadow(0 0 10px currentColor) drop-shadow(0 0 18px #fff8) drop-shadow(0 1px 0 #000)} 50%{filter:drop-shadow(0 0 16px currentColor) drop-shadow(0 0 24px #fff) drop-shadow(0 1px 0 #000)}}
@keyframes halo6{
  0%,100%{filter:drop-shadow(0 0 12px currentColor) drop-shadow(0 0 22px #fff8) drop-shadow(0 0 32px #c9a25a) drop-shadow(0 1px 0 #000)}
  50%{filter:drop-shadow(0 0 20px currentColor) drop-shadow(0 0 32px #fff) drop-shadow(0 0 44px #e8c878) drop-shadow(0 1px 0 #000)}
}
@keyframes halo7{
  0%,100%{filter:drop-shadow(0 0 14px currentColor) drop-shadow(0 0 28px #fff) drop-shadow(0 0 40px var(--gold-bright)) drop-shadow(0 0 50px #fff) drop-shadow(0 1px 0 #000)}
  33%{filter:drop-shadow(0 0 22px #fff) drop-shadow(0 0 36px currentColor) drop-shadow(0 0 50px var(--gold-bright)) drop-shadow(0 1px 0 #000)}
  66%{filter:drop-shadow(0 0 18px var(--gold-bright)) drop-shadow(0 0 32px currentColor) drop-shadow(0 0 56px #fff) drop-shadow(0 1px 0 #000)}
}
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)}}
@keyframes floaty7{
  0%,100%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-2px) rotate(.5deg)}
  50%{transform:translateY(-4px) rotate(0deg)}
  75%{transform:translateY(-2px) rotate(-.5deg)}
}
@keyframes spawn{
  0%{transform:scale(.2) rotate(-30deg); opacity:0; filter:brightness(2)}
  60%{transform:scale(1.15) rotate(4deg); opacity:1}
  100%{transform:scale(1) rotate(0); opacity:1; filter:brightness(1)}
}
@keyframes mergeOut{
  0%{transform:scale(1); opacity:1}
  100%{transform:scale(.4); opacity:0; filter:brightness(2.5)}
}
@keyframes mergeIn{
  0%{transform:scale(.3); opacity:0; filter:brightness(2.5)}
  50%{transform:scale(1.4); opacity:1; filter:brightness(1.7)}
  100%{transform:scale(1); opacity:1; filter:brightness(1)}
}

/* ================ GENERATEURS ================ */
#generators{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:6px;
  padding:0 2px;
}
.gen{
  position:relative;
  background:
    radial-gradient(ellipse 80% 60% at 50% 90%, rgba(232,160,80,.22), transparent 70%),
    linear-gradient(180deg, #1f1418, #0a0608);
  border:1px solid var(--gold-dark);
  border-radius:3px;
  padding:6px 4px 4px;
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center;
  transition:transform .1s, filter .2s;
  overflow:hidden;
  min-height:96px;
}
.gen::before{
  content:""; position:absolute; left:4px; right:4px; bottom:0; height:4px;
  background:linear-gradient(90deg, transparent, var(--flame), transparent);
  opacity:.55; filter:blur(2px);
}
.gen[data-chain="0"]::before{background:linear-gradient(90deg, transparent, var(--plant-2), transparent)}
.gen[data-chain="1"]::before{background:linear-gradient(90deg, transparent, var(--mineral-2), transparent)}
.gen[data-chain="2"]::before{background:linear-gradient(90deg, transparent, var(--essence-2), transparent)}
.gen:active{transform:scale(.96)}
.gen.cooldown{filter:grayscale(.5) brightness(.75); cursor:wait}
.gen.locked{filter:grayscale(1) brightness(.4); cursor:not-allowed}
.gen .gen-stack{position:relative; width:54px; height:54px}
.gen .gen-svg{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; filter:drop-shadow(0 2px 0 #000)}
.gen .gen-bubbles{position:absolute; inset:0; pointer-events:none}
.gen .gen-name{
  font-family:"Cinzel", serif; font-weight:700;
  font-size:9px; letter-spacing:.18em;
  color:var(--gold-light);
  margin-top:3px; text-transform:uppercase;
}
.gen .gen-cost{
  font-family:"VT323", monospace; font-size:13px;
  color:var(--parchment-2); margin-top:1px;
  display:flex; align-items:center; gap:3px;
}
.gen .gen-cost svg{width:10px; height:10px}
.gen .cd-bar{
  position:absolute; left:2px; right:2px; bottom:5px; height:2px;
  background:rgba(0,0,0,.6); border-radius:1px; overflow:hidden;
}
.gen .cd-bar > span{
  display:block; height:100%; width:0%;
  background:var(--gold-bright);
  transition:width .1s linear;
}

/* ================ SIDE TOGGLES (livre / parchemin) ================ */
.side-toggle{
  position:fixed; top:50%; transform:translateY(-50%);
  z-index:6;
  background:linear-gradient(90deg, var(--leather), #2a1f1a);
  color:var(--gold-bright);
  border:1px solid var(--gold-dark);
  padding:10px 6px;
  cursor:pointer;
  font-family:"Cinzel", serif;
  font-size:9px;
  letter-spacing:.22em;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.side-toggle .ico{width:16px; height:16px; color:var(--gold-bright)}
.side-toggle .label{writing-mode:vertical-rl}
.side-toggle .badge{
  background:var(--blood); color:#fff;
  font-family:"VT323", monospace; font-size:11px;
  border-radius:50%; width:14px; height:14px; line-height:14px;
  text-align:center;
  box-shadow:0 0 8px var(--blood);
  display:none;
}
.side-toggle .badge.show{display:inline-block; animation:badgePulse 1.4s ease-in-out infinite}
@keyframes badgePulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.15)}}
#codex-toggle{left:0; border-left:none; border-radius:0 3px 3px 0}
#quest-toggle{right:0; border-right:none; border-radius:3px 0 0 3px}

/* ================ DRAWERS ================ */
.drawer{
  position:fixed; top:0; bottom:0; width:340px;
  z-index:7;
  background:
    radial-gradient(ellipse 60% 30% at 50% 0%, rgba(232,160,80,.08), transparent 60%),
    linear-gradient(180deg, #1a1218, #0a0608);
  border:1px solid var(--gold-dark);
  transition:transform .35s cubic-bezier(.2,.9,.2,1);
  display:flex; flex-direction:column;
  padding:14px 12px 12px;
  overflow:hidden;
}
#codex.drawer{left:0; border-left:none; transform:translateX(-100%); box-shadow:20px 0 40px rgba(0,0,0,.8)}
#quests.drawer{right:0; border-right:none; transform:translateX(100%); box-shadow:-20px 0 40px rgba(0,0,0,.8)}
#codex.drawer.open{transform:translateX(0)}
#quests.drawer.open{transform:translateX(0)}

.drawer h2{
  font-family:"Cinzel", serif; font-weight:900;
  letter-spacing:.20em; font-size:14px;
  color:var(--gold-bright); margin:0 0 4px;
  text-align:center;
  text-shadow:0 0 12px var(--gold-glow);
}
.drawer .subtitle{
  font-family:"Cormorant Garamond", serif; font-style:italic;
  font-size:12px; color:var(--gold); opacity:.75;
  text-align:center; margin-bottom:8px;
  letter-spacing:.18em;
}
.drawer .divider{
  height:18px; margin:8px 0;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold); opacity:.7;
}
.drawer .divider svg{width:120px; height:14px}
.drawer-body{flex:1; overflow-y:auto; padding-right:4px}
.drawer-body::-webkit-scrollbar{width:4px}
.drawer-body::-webkit-scrollbar-thumb{background:var(--gold-dark); border-radius:2px}

/* QUETES */
.quest{
  position:relative;
  background:
    repeating-linear-gradient(0deg,
      rgba(216,198,154,.04) 0px, rgba(216,198,154,.04) 1px,
      transparent 1px, transparent 3px),
    linear-gradient(180deg, #2a1f1a, #1a1410);
  border:1px solid var(--gold-dark);
  border-radius:2px;
  padding:8px 10px;
  margin-bottom:8px;
}
.quest::before, .quest::after{
  content:""; position:absolute; width:6px; height:6px;
  border:1px solid var(--gold); pointer-events:none;
}
.quest::before{top:-1px; left:-1px; border-right:none; border-bottom:none}
.quest::after{bottom:-1px; right:-1px; border-left:none; border-top:none}
.quest .qname{
  font-family:"Cinzel", serif; font-weight:700;
  font-size:11px; letter-spacing:.14em;
  color:var(--gold-bright);
  text-transform:uppercase;
  margin-bottom:3px;
}
.quest .qdesc{
  font-family:"Cormorant Garamond", serif;
  font-size:13px; color:var(--parchment-2);
  margin-bottom:6px; font-style:italic;
}
.quest .qprog{
  display:flex; align-items:center; gap:8px;
  font-family:"VT323", monospace; font-size:13px;
  color:var(--gold-light);
}
.quest .qbar{
  flex:1; height:5px;
  background:#0a0608;
  border:1px solid var(--gold-dark);
  border-radius:1px;
  overflow:hidden;
}
.quest .qbar > span{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg, var(--gold-dark), var(--gold-bright));
  box-shadow:0 0 4px var(--gold-glow);
  transition:width .3s;
}
.quest .qreward{
  display:flex; align-items:center; gap:4px;
  font-family:"VT323", monospace; font-size:13px;
  color:var(--gold-bright); margin-top:4px;
}
.quest .qreward svg{width:12px; height:12px}
.quest.done{
  border-color:var(--gold-bright);
  cursor:pointer;
  animation:pulseGold 1.6s ease-in-out infinite;
}
@keyframes pulseGold{
  0%,100%{box-shadow:0 0 0 transparent, inset 0 0 0 transparent}
  50%{box-shadow:0 0 16px var(--gold-glow), inset 0 0 12px rgba(232,200,120,.18)}
}
.quest.done .qclaim{
  display:block; text-align:center;
  font-family:"Cinzel", serif; font-weight:700;
  font-size:11px; letter-spacing:.22em;
  color:#000; background:linear-gradient(180deg, var(--gold-bright), var(--gold));
  padding:4px; margin-top:6px;
  text-transform:uppercase;
}

/* CODEX */
.codex-chain{margin-bottom:16px}
.codex-chain h3{
  font-family:"Cinzel", serif; font-weight:700;
  font-size:11px; letter-spacing:.18em;
  margin:0 0 6px;
  text-transform:uppercase;
  display:flex; align-items:center; gap:6px;
}
.codex-chain h3 .sym{width:14px; height:14px; flex-shrink:0}
.codex-chain[data-chain="0"] h3{color:var(--plant-2)}
.codex-chain[data-chain="1"] h3{color:var(--mineral-2)}
.codex-chain[data-chain="2"] h3{color:var(--essence-2)}
.codex-row{
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  gap:3px;
}

/* Hauts Faits grid */
.achievements-section{margin-top:18px}
.ach-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:5px;
}
.ach-cell{

function checkAchievements(){
  if(!STATE.achievements) STATE.achievements = {};
  let unlocked = 0;
  for(const a of ACHIEVEMENTS){
    if(STATE.achievements[a.id]) continue;
    if(a.check(STATE)){
      STATE.achievements[a.id] = Date.now();
      STATE.gold += a.reward;
      achievementToast(a);
      unlocked++;
    }
  }
  if(unlocked > 0){ renderStats(); renderCodex(); }
  return unlocked;
}

function achievementToast(a){
  const el = document.createElement("div");
  el.className = "achievement-toast";
  el.innerHTML = `
    <div class="ach-banner">HAUT FAIT</div>
    <div class="ach-name">${a.name}</div>
    <div class="ach-desc">${a.desc}</div>
    <div class="ach-reward">+${a.reward} couronnes</div>
  `;
  document.body.appendChild(el);
  // sound
  if(A.ctx){
    blip(660, .14, "triangle", .22, .5);
    setTimeout(()=>blip(880, .16, "triangle", .22, .5), 80);
    setTimeout(()=>blip(1320, .22, "sine", .26, .6), 180);
  }
  vibrate([14, 30, 14, 30, 80]);
  setTimeout(()=>el.classList.add("show"), 30);
  setTimeout(()=>el.classList.remove("show"), 4000);
  setTimeout(()=>el.remove(), 4800);
}

function spriteSVG(grid){
  const N = 32;
  let rects = "";
  // emit by column run for compactness
  for(let y=0; y<N; y++){
    let runStart = -1, runChar = '.';
    for(let x=0; x<N; x++){
      const ch = grid[y][x];
      if(ch === runChar){ continue; }
      if(runChar !== '.' && runStart >= 0){
        const c = PAL[runChar];
        if(c) rects += `<rect x="${runStart}" y="${y}" width="${x-runStart}" height="1" fill="${c}"/>`;
      }
      runStart = x; runChar = ch;
    }
    if(runChar !== '.' && runStart >= 0){
      const c = PAL[runChar];
      if(c) rects += `<rect x="${runStart}" y="${y}" width="${N-runStart}" height="1" fill="${c}"/>`;
    }
  }
  return `<svg class="sprite" viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">${rects}</svg>`;
}

  if(q.type==="merge_any") return STATE.totals.merged.reduce((a,b)=>a+b,0);

const EVENT_INTERVAL_MIN = 110000;  // ~110s minimum entre 2 events
const EVENT_INTERVAL_MAX = 220000;  // ~220s max
let nextEventAt = 0;

function maybeFireEvent(now){
  if(now < nextEventAt) return;
  // Premier set quand on rentre dans le cabinet
  if(nextEventAt === 0){ nextEventAt = now + EVENT_INTERVAL_MIN + Math.random()*(EVENT_INTERVAL_MAX-EVENT_INTERVAL_MIN); return; }
  fireEvent();
  nextEventAt = now + EVENT_INTERVAL_MIN + Math.random()*(EVENT_INTERVAL_MAX-EVENT_INTERVAL_MIN);
}

function fireEvent(){
  const e = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  STATE.lastEvent = e.id;
  let extra = "";
  if(e.apply) extra = e.apply();
  if(e.duration > 0){
    STATE.activeEvents = STATE.activeEvents || {};
    STATE.activeEvents[e.id] = {
      id:e.id, name:e.name, expiresAt: Date.now() + e.duration,
      multipliers: e.multipliers || {}
    };
  }
  eventNotification(e, extra);
  if(A.ctx){
    blip(330, .25, "triangle", .2, .6);
    setTimeout(()=>blip(495, .3, "sine", .2, .6), 150);
    setTimeout(()=>blip(660, .4, "triangle", .24, .7), 320);
  }
  vibrate([22, 60, 22]);
  applyEventModifiers();
}

function eventNotification(e, extra){
  const el = document.createElement("div");
  el.className = "event-toast";
  el.innerHTML = `
    <div class="ev-banner">ÉVÈNEMENT</div>
    <div class="ev-name">${e.name}</div>
    <div class="ev-desc">${e.desc}</div>
    ${extra ? `<div class="ev-extra">${extra}</div>` : ""}
  `;
  document.body.appendChild(el);
  setTimeout(()=>el.classList.add("show"), 30);
  setTimeout(()=>el.classList.remove("show"), 4500);
  setTimeout(()=>el.remove(), 5400);
}

function applyEventModifiers(){
  // Appliqué au démarrage de l'event ou quand un expire
  const ae = STATE.activeEvents || {};
  let cdMul = 1, regenMul = 1;
  for(const id in ae){ const a = ae[id]; if(a.multipliers?.cdMul) cdMul *= a.multipliers.cdMul; if(a.multipliers?.regenMul) regenMul *= a.multipliers.regenMul; }
  STATE.eventCdMul = cdMul;
  STATE.eventRegenMul = regenMul;
}

function tickEvents(now){
  // Expirer les events échus
  const ae = STATE.activeEvents || {};
  let changed = false;
  for(const id in ae){ if(ae[id].expiresAt <= Date.now()){ delete ae[id]; changed = true; } }
  if(changed) applyEventModifiers();
  // Possiblement firer un nouveau event
  maybeFireEvent(now);
}

/* ================ AUDIO ================ */
const A = { ctx:null, master:null, drone:null, droneOn:false, reverb:null };
function audioInit(){
  if(A.ctx) return;
  A.ctx = new (window.AudioContext||window.webkitAudioContext)();
  A.master = A.ctx.createGain();
  A.master.gain.value = STATE.audio ? .35 : 0;
  // Reverb : convolution avec impulse synthétique
  const ir = makeImpulse(2.6, 2.4);
  A.reverb = A.ctx.createConvolver();
  A.reverb.buffer = ir;
  const wet = A.ctx.createGain();
  wet.gain.value = .25;
  A.reverb.connect(wet).connect(A.master);
  A.master.connect(A.ctx.destination);
  A.wet = wet;
}
function makeImpulse(seconds=2, decay=2){
  const r = 44100;
  const len = r*seconds;
  const buf = (A.ctx||(new (window.AudioContext||window.webkitAudioContext)())).createBuffer(2, len, r);
  for(let ch=0; ch<2; ch++){
    const data = buf.getChannelData(ch);
    for(let i=0; i<len; i++){
      data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, decay);
    }
  }
  return buf;
}
function startDrone(){
  if(!A.ctx || A.droneOn) return;
  A.droneOn = true;
  // Pad multi-voix detuné + filtre + LFO
  const fund = 55; // A1
  const filt = A.ctx.createBiquadFilter();
  filt.type = "lowpass"; filt.frequency.value = 380; filt.Q.value = .7;
  const gain = A.ctx.createGain(); gain.gain.value = .14;
  filt.connect(gain); gain.connect(A.master); gain.connect(A.reverb);

  const partials = [
    {f:fund, type:"sine",     g:.55, det:0},
    {f:fund*1.5, type:"triangle", g:.30, det:7},
    {f:fund*2.0, type:"sine",     g:.18, det:-4},
    {f:fund*3.0, type:"sine",     g:.10, det:11},
    {f:fund*1.25, type:"triangle", g:.16, det:-9},
  ];
  partials.forEach((p,i)=>{
    const o = A.ctx.createOscillator();
    o.type = p.type; o.frequency.value = p.f; o.detune.value = p.det;
    const g = A.ctx.createGain(); g.gain.value = p.g;
    o.connect(g).connect(filt);
    o.start();
    // LFO sur la frequence pour vibrato lent
    const lfo = A.ctx.createOscillator();
    const lg = A.ctx.createGain();
    lfo.frequency.value = .07 + i*.04;
    lg.gain.value = p.f*.004;
    lfo.connect(lg).connect(o.frequency);
    lfo.start();
  });

  // Layer de souffle / vent (bruit blanc filtré passe-bande)
  const noise = makeNoiseBuffer(4);
  const ns = A.ctx.createBufferSource();
  ns.buffer = noise; ns.loop = true;
  const nbf = A.ctx.createBiquadFilter();
  nbf.type = "bandpass"; nbf.frequency.value = 380; nbf.Q.value = 1.6;
  const ng = A.ctx.createGain(); ng.gain.value = .025;
  ns.connect(nbf).connect(ng).connect(A.master);
  ns.start();
  // LFO sur le filtre du vent
  const wlfo = A.ctx.createOscillator();
  const wlg = A.ctx.createGain();
  wlfo.frequency.value = .12;
  wlg.gain.value = 200;
  wlfo.connect(wlg).connect(nbf.frequency);
  wlfo.start();
}
function makeNoiseBuffer(seconds=2){
  const r = 44100;
  const buf = A.ctx.createBuffer(1, r*seconds, r);
  const data = buf.getChannelData(0);
  for(let i=0; i<data.length; i++) data[i] = Math.random()*2-1;
  return buf;
}

function blip(freq=440, dur=.1, type="sine", vol=.3, wet=.3){
  if(!A.ctx) return;
  const o = A.ctx.createOscillator();
  const g = A.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = 0;
  o.connect(g);
  g.connect(A.master);
  if(A.reverb && wet>0){
    const w = A.ctx.createGain(); w.gain.value = wet;
    g.connect(w); w.connect(A.reverb);
  }
  const t = A.ctx.currentTime;
  g.gain.linearRampToValueAtTime(vol, t+.005);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.start(t); o.stop(t+dur+.05);
}

function achIconSVG(kind, size=14){
  const s = size;
  const stroke = "currentColor";
  const sw = 1.4;
  const wrap = inner => `<svg viewBox="0 0 24 24" style="width:${s}px;height:${s}px" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round">${inner}</svg>`;
  switch(kind){
    case "sulfur":   return wrap('<polygon points="12,4 7,12 17,12"/><line x1="12" y1="12" x2="12" y2="20"/><line x1="9" y1="17" x2="15" y2="17"/>');
    case "salt":     return wrap('<circle cx="12" cy="12" r="6"/><line x1="6" y1="12" x2="18" y2="12"/>');
    case "mercury":  return wrap('<path d="M7 7 q5 -4 10 0"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="9" y1="20" x2="15" y2="20"/>');
    case "fuse":     return wrap('<circle cx="8" cy="12" r="4"/><circle cx="16" cy="12" r="4"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/>');
    case "horn":     return wrap('<path d="M5 18 q-1 -8 6 -10 q5 -1 8 2 l-1 4 q3 0 4 3 q-1 2 -3 1 q-1 4 -5 4 q-6 0 -9 -4 z"/>');
    case "crown":    return wrap('<path d="M4 18 V10 l3 4 l5 -8 l5 8 l3 -4 V18 z"/><path d="M4 18 H20" stroke-width="1.8"/>');
    case "trinity":  return wrap('<circle cx="9" cy="9" r="4"/><circle cx="15" cy="9" r="4"/><circle cx="12" cy="15" r="4"/>');
    case "eye":      return wrap('<path d="M3 12 q4 -7 9 -7 q5 0 9 7 q-4 7 -9 7 q-5 0 -9 -7z"/><circle cx="12" cy="12" r="3" fill="currentColor"/>');
    case "book":     return wrap('<rect x="4" y="3" width="16" height="18" rx="1"/><line x1="12" y1="3" x2="12" y2="21"/><path d="M7 9 h3 M14 9 h3"/>');
    case "hourglass":return wrap('<path d="M6 4 H18 L13 11 L18 18 L18 20 H6 V18 L11 11 L6 4 z"/>');
    default: return wrap('<circle cx="12" cy="12" r="6"/>');
  }
}

function fmtNumber(n){
  if(n >= 1_000_000) return (n/1_000_000).toFixed(n>=10_000_000?0:1) + "M";
  if(n >= 10_000)    return (n/1000).toFixed(0) + "k";
  if(n >= 1000)      return (n/1000).toFixed(1) + "k";
  return ""+n;
}

/* ================ GENERATEURS ================ */
function fireGenerator(idx, el){
  const g = STATE.generators[idx];
  if(!g.unlocked) { sfxDeny(); return; }
  const now = performance.now();
  const effCd = g.cdMs * (STATE.eventCdMul || 1);
  if(now - g.lastFire < effCd) { return; }
  if(STATE.essence < g.cost) { sfxDeny(); flashStat("essence-val"); return; }
  const empties = findEmpty();
  if(!empties.length) { sfxDeny(); shake(el); return; }
  STATE.essence -= g.cost;
  g.lastFire = now;
  const [x,y] = empties[Math.floor(Math.random()*empties.length)];
  setTile(x,y,{ id: STATE.nextId++, chain: g.chain, tier: g.tier });
  STATE.totals.produced[g.chain]++;
  STATE.totals.maxTier[g.chain] = Math.max(STATE.totals.maxTier[g.chain], g.tier);
  renderTile(x,y);
  renderStats();
  refreshQuests();
  sfxSpawn(g.chain);
  vibrate(8);
  audioInit();
  if(typeof checkAchievements === 'function') checkAchievements();
  // burst from cauldron
  const r = el.getBoundingClientRect();
  particles(r.left + r.width/2, r.top + 14, CHAINS[g.chain].color, 14);
}
function shake(el){
  el.animate([
    { transform:"translateX(0)" },{ transform:"translateX(-3px)" },
    { transform:"translateX(3px)" },{ transform:"translateX(0)" }
  ], { duration:240 });
}
function flashStat(id){
  const el = document.getElementById(id).parentElement;
  el.animate([
    { boxShadow:"0 0 0 transparent" },
    { boxShadow:"0 0 20px #c84a2a" },
    { boxShadow:"0 0 0 transparent" }
  ], { duration:400 });
}
function tickGenerators(now){
  $gens.querySelectorAll(".gen").forEach((el, i)=>{
    const g = STATE.generators[i];
    const dt = now - g.lastFire;
    const effCd = g.cdMs * (STATE.eventCdMul || 1);
    const cdPct = Math.min(100, (dt/effCd)*100);
    el.querySelector(".cd-bar > span").style.width = cdPct + "%";
    el.classList.toggle("cooldown", dt < effCd);
  });
  // bulles canvas
  $gens.querySelectorAll(".gen-bubbles").forEach((cv, i)=>{
    const ctx = cv.getContext("2d");
    drawCauldronBubbles(ctx, cv.width, cv.height, i, now);
  });
}

/* Bulles dans les cauldrons */
const BUB = [[],[],[]];
function drawCauldronBubbles(ctx, w, h, chainIdx, now){
  ctx.clearRect(0,0,w,h);
  // spawn
  if(Math.random() < .35){
    BUB[chainIdx].push({
      x: w*.32 + Math.random()*w*.36,
      y: h*.78,
      r: .8 + Math.random()*1.6,
      vy: -.18 - Math.random()*.25,
      a: .9, born: now,
    });
  }
  const colors = [
    ['#a8d890','#7ab36a'], // plant
    ['#a8c8e8','#7aa3c8'], // mineral
    ['#c898e8','#a070d0'], // essence
  ];
  const [hi, lo] = colors[chainIdx];
  for(let i=BUB[chainIdx].length-1; i>=0; i--){
    const b = BUB[chainIdx][i];
    b.y += b.vy; b.a -= .012;
    if(b.a <= 0 || b.y < h*.55){ BUB[chainIdx].splice(i,1); continue; }
    ctx.fillStyle = lo; ctx.globalAlpha = b.a*.7;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = hi; ctx.globalAlpha = b.a;
    ctx.beginPath(); ctx.arc(b.x - b.r*.3, b.y - b.r*.3, b.r*.45, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ================ DRAG / MERGE ================ */
let drag = null;

function attachDrag(el, x, y){
  el.addEventListener("pointerdown", e=>{
    e.preventDefault();
    audioInit();
    const t = STATE.grid[y][x];
    if(!t) return;
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    drag = {
      pid: e.pointerId, tile:t, fromX:x, fromY:y, el,
      startX:e.clientX, startY:e.clientY, moved:false,
    };
    el.classList.add("dragging");
    moveDrag(e.clientX, e.clientY);
  });
  el.addEventListener("pointermove", e=>{
    if(!drag || drag.pid !== e.pointerId) return;
    const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if(!drag.moved && Math.hypot(dx,dy) > 4) drag.moved = true;
    moveDrag(e.clientX, e.clientY);
  });
  el.addEventListener("pointerup", e=>{
    if(!drag || drag.pid !== e.pointerId) return;
    endDrag(e.clientX, e.clientY);
  });
  el.addEventListener("pointercancel", ()=>{
    if(!drag) return;
    endDrag(null);
  });
}

function pointerToCell(cx, cy){
  const el = document.elementFromPoint(cx, cy);
  if(!el) return null;
  const cell = el.closest(".cell");
  if(!cell) return null;
  return { x:+cell.dataset.x, y:+cell.dataset.y, el:cell };
}

function moveDrag(cx, cy){
  document.querySelectorAll(".cell.drop, .cell.merge-target").forEach(c=>c.classList.remove("drop","merge-target"));
  const gridR = $grid.getBoundingClientRect();
  drag.el.style.position = "fixed";
  drag.el.style.left = (cx - drag.el.offsetWidth/2) + "px";
  drag.el.style.top  = (cy - drag.el.offsetHeight/2) + "px";
  drag.el.style.width = (gridR.width / COLS - 4) + "px";
  drag.el.style.height = (gridR.height / ROWS - 4) + "px";
  const tgt = pointerToCell(cx, cy);
  if(tgt){
    const dest = STATE.grid[tgt.y][tgt.x];
    if(!dest || (tgt.x===drag.fromX && tgt.y===drag.fromY)){
      tgt.el.classList.add("drop");
    } else if(dest.chain === drag.tile.chain && dest.tier === drag.tile.tier && dest.tier < TIERS-1){
      tgt.el.classList.add("merge-target");
    } else {
      tgt.el.classList.add("drop");
    }
  }
}

function endDrag(cx, cy){
  const d = drag;
  drag = null;
  document.querySelectorAll(".cell.drop, .cell.merge-target").forEach(c=>c.classList.remove("drop","merge-target"));
  if(!d) return;
  d.el.classList.remove("dragging");
  d.el.style.position = ""; d.el.style.left=""; d.el.style.top="";
  d.el.style.width=""; d.el.style.height="";

  if(cx===null) { renderTile(d.fromX, d.fromY); return; }
  const tgt = pointerToCell(cx, cy);
  if(!tgt || (tgt.x===d.fromX && tgt.y===d.fromY)) {
    renderTile(d.fromX, d.fromY); return;
  }
  const dest = STATE.grid[tgt.y][tgt.x];
  if(!dest){
    setTile(tgt.x, tgt.y, d.tile);
    setTile(d.fromX, d.fromY, null);
    renderTile(d.fromX, d.fromY);
    renderTile(tgt.x, tgt.y);
  } else if(dest.chain === d.tile.chain && dest.tier === d.tile.tier && dest.tier < TIERS-1){
    doMerge(d.fromX, d.fromY, tgt.x, tgt.y);
  } else {
    setTile(d.fromX, d.fromY, dest);
    setTile(tgt.x, tgt.y, d.tile);
    renderTile(d.fromX, d.fromY);
    renderTile(tgt.x, tgt.y);
  }
}

function doMerge(fx, fy, tx, ty){
  const a = STATE.grid[fy][fx], b = STATE.grid[ty][tx];
  let newTier = b.tier + 1;
  // Comet boost : saute un palier supplémentaire (max TIERS-1)
  if(STATE.cometBoost > 0 && newTier < TIERS-1){
    newTier = Math.min(TIERS-1, newTier + 1);
    STATE.cometBoost = 0;
    floating(cellAt(tx,ty).getBoundingClientRect().left + 30, cellAt(tx,ty).getBoundingClientRect().top - 12, "✦ COMÈTE", "tier");
  }
  const cellFrom = cellAt(fx, fy), cellTo = cellAt(tx, ty);
  cellFrom.firstChild?.classList.add("merge-out");
  cellTo.firstChild?.classList.add("merge-out");
  const r1 = cellFrom.getBoundingClientRect(), r2 = cellTo.getBoundingClientRect();
  const ax = r1.left + r1.width/2, ay = r1.top + r1.height/2;
  const bx = r2.left + r2.width/2, by = r2.top + r2.height/2;
  const ch = CHAINS[a.chain];

  // ÉCLAIR entre les deux tuiles
  lightning(ax, ay, bx, by, ch.color);
  cellFrom.classList.add("flash");
  cellTo.classList.add("flash");
  setTimeout(()=>{
    cellFrom.classList.remove("flash");
    cellTo.classList.remove("flash");
  }, 360);

  particles(ax, ay, ch.color, 22, bx, by);
  shockwave(bx, by, ch.color, newTier);
  sfxMerge(newTier, a.chain);
  vibrate([12, 30, 18]);
  floating(bx, by - 30, "▲ " + ch.tiers[newTier].n, "tier");

  setTimeout(()=>{
    setTile(fx, fy, null);
    setTile(tx, ty, { id: STATE.nextId++, chain:a.chain, tier:newTier });
    STATE.totals.merged[a.chain]++;
    const wasMaxBefore = STATE.totals.maxTier[a.chain];
    STATE.totals.maxTier[a.chain] = Math.max(wasMaxBefore, newTier);
    renderTile(fx, fy);
    renderTile(tx, ty);
    const nt = cellAt(tx,ty).firstChild;
    if(nt){ nt.classList.add("merge-in"); setTimeout(()=>nt.classList.remove("merge-in"), 560); }
    refreshQuests();
    renderCodex();

    // Cinématique Grand Œuvre à chaque palier ultime atteint pour la première fois
    const goldMul = (STATE.activeEvents?.deepnight?.multipliers?.mergeGoldMul) || 1;
    if(newTier >= 5 && (STATE.firstReached[a.chain] || 0) < newTier){
      STATE.firstReached[a.chain] = newTier;
      const reward = Math.floor((TIER_REWARDS[newTier] || 200) * goldMul);
      STATE.gold += reward;
      grandOeuvre(a.chain, newTier);
    } else if(newTier >= 5){
      const reward = Math.floor((TIER_REWARDS[newTier] || 200) * .25 * goldMul);
      STATE.gold += reward;
      floating(bx, by + 10, "+"+reward, "gain");
      sfxClaim();
    } else if(goldMul > 1 && newTier >= 2){
      // bonus or sur fusions intermédiaires pendant Nuit Profonde
      const bonus = Math.floor((newTier * 2) * (goldMul - 1));
      if(bonus > 0){ STATE.gold += bonus; floating(bx, by + 10, "+"+bonus, "gain"); }
    }
    // Hook achievements
    if(typeof checkAchievements === 'function') checkAchievements();
    renderStats();
  }, 280);
}

/* ================ QUETES — claim ================ */
function claimQuest(q){
  if(!q.done || q.claimed) return;
  q.claimed = true;
  const goldMul = (STATE.activeEvents?.goldbreath?.multipliers?.goldMul) || 1;
  const reward = Math.floor(q.reward * goldMul);
  STATE.gold += reward;
  q.actualReward = reward;
  sfxClaim();
  vibrate(20);
  const r = document.getElementById("quests").getBoundingClientRect();
  floating(r.left + r.width/2, r.top + 80, "+"+reward+" couronnes", "gain");
  renderStats();
  refreshQuests();
  applyProgressionBonuses();
  if(typeof checkAchievements === 'function') checkAchievements();
}
function applyProgressionBonuses(){
  const factor = Math.max(.4, 1 - STATE.gold/4000);
  STATE.generators.forEach((g, i)=>{
    g.cdMs = [1500, 2200, 3000][i] * factor;
  });
  if(STATE.gold >= 200){ STATE.essenceMax = 80; STATE.essenceRegen = 1.4; }
  if(STATE.gold >= 800){ STATE.essenceMax = 120; STATE.essenceRegen = 2; }
  if(STATE.gold >= 2500){ STATE.essenceMax = 200; STATE.essenceRegen = 3; }
}

/* DUST */
const DUST = [];
function initDust(){
  DUST.length = 0;
  const N = 50;
  for(let i=0;i<N;i++){
    DUST.push({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      r: .4 + Math.random()*1.6,
      vy: -.05 - Math.random()*.15,
      vx: (Math.random()-.5)*.06,
      a: .15 + Math.random()*.45,
      ph: Math.random()*Math.PI*2,
    });
  }
}
function tickDust(){
  dustCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
  for(const p of DUST){
    p.x += p.vx + Math.sin(p.ph)*.05;
    p.y += p.vy;
    p.ph += .02;
    if(p.y < -10){ p.y = window.innerHeight + 10; p.x = Math.random()*window.innerWidth; }
    const al = p.a * (.6 + .4*Math.sin(p.ph));
    dustCtx.fillStyle = `rgba(232,200,120,${al})`;
    dustCtx.beginPath();
    dustCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    dustCtx.fill();
  }
}

/* CANDLES (bougies aux 2 coins supérieurs) */
const CANDLES = [
  { x:0, y:0, ph:0 }, // sera positionné dans tickCandles
  { x:0, y:0, ph:Math.PI }
];
const EMBERS = [];
function tickCandles(now){
  cdCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
  // positions : coins supérieurs, hors header
  CANDLES[0].x = 28; CANDLES[0].y = 70;
  CANDLES[1].x = window.innerWidth - 28; CANDLES[1].y = 70;
  for(const c of CANDLES){
    c.ph += .12;
    drawCandle(cdCtx, c.x, c.y, c.ph);
    // braises occasionnelles
    if(Math.random() < .04){
      EMBERS.push({
        x: c.x + (Math.random()-.5)*4,
        y: c.y - 10,
        vx:(Math.random()-.5)*.4,
        vy:-.6 - Math.random()*.6,
        a:1, r:.6+Math.random()*1.2,
        col: Math.random()<.5 ? '#e8a050':'#ffd070',
      });
    }
  }
  for(let i=EMBERS.length-1; i>=0; i--){
    const e = EMBERS[i];
    e.x += e.vx; e.y += e.vy;
    e.vy += .005; e.a -= .012;
    if(e.a <= 0){ EMBERS.splice(i,1); continue; }
    cdCtx.fillStyle = e.col; cdCtx.globalAlpha = e.a;
    cdCtx.beginPath(); cdCtx.arc(e.x, e.y, e.r, 0, Math.PI*2); cdCtx.fill();
    cdCtx.fillStyle = '#fff'; cdCtx.globalAlpha = e.a*.4;
    cdCtx.beginPath(); cdCtx.arc(e.x, e.y, e.r*.5, 0, Math.PI*2); cdCtx.fill();
  }
  cdCtx.globalAlpha = 1;
}
function drawCandle(ctx, x, y, ph){
  // halo
  const halo = 50 + Math.sin(ph*2.3)*6 + Math.sin(ph*5.1)*3;
  const grad = ctx.createRadialGradient(x, y-10, 4, x, y-10, halo);
  grad.addColorStop(0, 'rgba(255,220,140,.55)');
  grad.addColorStop(.4, 'rgba(232,160,80,.18)');
  grad.addColorStop(1, 'rgba(232,160,80,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(x, y-10, halo, 0, Math.PI*2); ctx.fill();

  // bougie (cire ivoire)
  ctx.fillStyle = '#d8c69a';
  ctx.fillRect(x-3, y, 6, 22);
  ctx.fillStyle = '#b8a072';
  ctx.fillRect(x+2, y, 1, 22);
  // gouttes de cire
  ctx.fillStyle = '#d8c69a';
  ctx.beginPath();
  ctx.arc(x-3, y+7, 1.5, 0, Math.PI*2);
  ctx.arc(x+3, y+12, 2, 0, Math.PI*2);
  ctx.fill();
  // mèche
  ctx.fillStyle = '#1a1318';
  ctx.fillRect(x, y-3, 1, 4);

  // flamme — forme de goutte avec flicker
  const flick = 1 + Math.sin(ph*3.7)*.08 + Math.sin(ph*9.1)*.05;
  const fh = 14 * flick;
  const fw = 5 * flick;
  // flamme externe orange
  ctx.beginPath();
  ctx.fillStyle = '#e8a050';
  ctx.moveTo(x, y - fh - 4);
  ctx.quadraticCurveTo(x+fw, y - fh*.5, x+fw*.3, y - 2);
  ctx.quadraticCurveTo(x, y, x-fw*.3, y - 2);
  ctx.quadraticCurveTo(x-fw, y - fh*.5, x, y - fh - 4);
  ctx.fill();
  // flamme intermédiaire
  ctx.beginPath();
  ctx.fillStyle = '#ffd070';
  const fh2 = fh*.7, fw2 = fw*.55;
  ctx.moveTo(x, y - fh2 - 3);
  ctx.quadraticCurveTo(x+fw2, y - fh2*.5, x+fw2*.4, y - 1);
  ctx.quadraticCurveTo(x, y - .5, x-fw2*.4, y - 1);
  ctx.quadraticCurveTo(x-fw2, y - fh2*.5, x, y - fh2 - 3);
  ctx.fill();
  // cœur blanc
  ctx.beginPath();
  ctx.fillStyle = '#fff5d8';
  const fh3 = fh*.45, fw3 = fw*.3;
  ctx.moveTo(x, y - fh3 - 2);
  ctx.quadraticCurveTo(x+fw3, y - fh3*.5, x, y - 1);
  ctx.quadraticCurveTo(x-fw3, y - fh3*.5, x, y - fh3 - 2);
  ctx.fill();
}

/* PARTICLES + SHOCKWAVE + LIGHTNING */
const FX_PARTS = [];
const SHOCKS = [];
const BOLTS = [];

function particles(x, y, color, n=14, tx=null, ty=null){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = .5 + Math.random()*2.8;
    FX_PARTS.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - .5,
      life: 1, max: 30 + Math.random()*30,
      r: 1 + Math.random()*2.5,
      color,
      tx, ty,
      kind: tx!==null ? "attract" : "burst",
    });
  }
}
function shockwave(x, y, color, tier){
  SHOCKS.push({ x, y, r:5, max: 50 + tier*22, life:1, color });
}
function lightning(x1, y1, x2, y2, color){
  BOLTS.push({
    x1, y1, x2, y2, color,
    pts: makeBoltPoints(x1, y1, x2, y2),
    life: 1, max: 18, born: performance.now(),
  });
}
function makeBoltPoints(x1, y1, x2, y2){
  const pts = [{x:x1, y:y1}];
  const segs = 8;
  for(let i=1; i<segs; i++){
    const t = i/segs;
    const dx = x2-x1, dy = y2-y1;
    const nx = -dy / Math.max(1, Math.hypot(dx,dy));
    const ny =  dx / Math.max(1, Math.hypot(dx,dy));
    const off = (Math.random()-.5) * 18;
    pts.push({x: x1+dx*t + nx*off, y: y1+dy*t + ny*off});
  }
  pts.push({x:x2, y:y2});
  return pts;
}

function tickFX(){
  fxCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
  // SHOCKS
  for(let i=SHOCKS.length-1;i>=0;i--){
    const s = SHOCKS[i];
    s.r += (s.max - s.r) * .15;
    s.life -= .04;
    if(s.life <= 0){ SHOCKS.splice(i,1); continue; }
    fxCtx.strokeStyle = s.color;
    fxCtx.globalAlpha = s.life;
    fxCtx.lineWidth = 2;
    fxCtx.beginPath(); fxCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); fxCtx.stroke();
    fxCtx.globalAlpha = s.life * .35;
    fxCtx.lineWidth = 8;
    fxCtx.beginPath(); fxCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); fxCtx.stroke();
  }
  // BOLTS
  fxCtx.lineCap = "round";
  for(let i=BOLTS.length-1;i>=0;i--){
    const b = BOLTS[i];
    b.life -= 1/b.max;
    if(b.life <= 0){ BOLTS.splice(i,1); continue; }
    // Re-jitter pour effet "vivant" 2 fois pendant la vie
    if(Math.random() < .25){
      b.pts = makeBoltPoints(b.x1, b.y1, b.x2, b.y2);
    }
    // Glow extérieur
    fxCtx.globalAlpha = b.life * .45;
    fxCtx.strokeStyle = b.color; fxCtx.lineWidth = 7;
    fxCtx.beginPath();
    fxCtx.moveTo(b.pts[0].x, b.pts[0].y);
    for(let j=1; j<b.pts.length; j++) fxCtx.lineTo(b.pts[j].x, b.pts[j].y);
    fxCtx.stroke();
    // cœur blanc
    fxCtx.globalAlpha = b.life;
    fxCtx.strokeStyle = "#fff"; fxCtx.lineWidth = 1.6;
    fxCtx.beginPath();
    fxCtx.moveTo(b.pts[0].x, b.pts[0].y);
    for(let j=1; j<b.pts.length; j++) fxCtx.lineTo(b.pts[j].x, b.pts[j].y);
    fxCtx.stroke();
  }
  fxCtx.globalAlpha = 1;
  // PARTICLES
  for(let i=FX_PARTS.length-1;i>=0;i--){
    const p = FX_PARTS[i];
    if(p.kind==="attract" && p.tx!==null){
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const d = Math.max(8, Math.hypot(dx,dy));
      p.vx += (dx/d) * .85; p.vy += (dy/d) * .85;
      p.vx *= .9; p.vy *= .9;
    } else {
      p.vy += .08; p.vx *= .98;
    }
    p.x += p.vx; p.y += p.vy;
    p.life -= 1/p.max;
    if(p.life <= 0){ FX_PARTS.splice(i,1); continue; }
    fxCtx.fillStyle = p.color;
    fxCtx.globalAlpha = p.life;
    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); fxCtx.fill();
    fxCtx.globalAlpha = p.life * .4;
    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.r*2.5, 0, Math.PI*2); fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;
}

/* CINEMATIC burst plein écran */
let CINEMA = null;
function cinematicBurst(color, tier=5){
  CINEMA = { life:1, max: 100 + (tier-5)*30, color, tier, born: performance.now() };
}
function tickCinema(){
  cnCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(!CINEMA) return;
  CINEMA.life -= 1/CINEMA.max;
  if(CINEMA.life <= 0){ CINEMA = null; return; }
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const r = (1 - CINEMA.life) * Math.hypot(window.innerWidth, window.innerHeight)*.7;
  cnCtx.strokeStyle = CINEMA.color;
  cnCtx.globalAlpha = CINEMA.life;
  cnCtx.lineWidth = 3;
  cnCtx.beginPath(); cnCtx.arc(cx, cy, r, 0, Math.PI*2); cnCtx.stroke();
  cnCtx.globalAlpha = CINEMA.life * .35;
  cnCtx.lineWidth = 16;
  cnCtx.beginPath(); cnCtx.arc(cx, cy, r, 0, Math.PI*2); cnCtx.stroke();
  // étoiles tout autour
  cnCtx.globalAlpha = CINEMA.life;
  cnCtx.fillStyle = "#fff";
  for(let i=0;i<20;i++){
    const a = i/20 * Math.PI*2;
    const rr = r + (Math.random()-.5)*40;
    cnCtx.beginPath();
    cnCtx.arc(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr, 2 + Math.random()*2, 0, Math.PI*2);
    cnCtx.fill();
  }
  cnCtx.globalAlpha = 1;
}

function floating(x, y, txt, kind="gain"){
  const f = document.createElement("div");
  f.className = "float " + kind;
  f.style.left = x + "px"; f.style.top = y + "px";
  f.textContent = txt;
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 1300);
}

function renderActiveEvents(){
  const wrap = document.getElementById("active-events");
  if(!wrap) return;
  const ae = STATE.activeEvents || {};
  const ids = Object.keys(ae);
  if(ids.length === 0){ if(wrap.children.length) wrap.innerHTML = ""; return; }
  wrap.innerHTML = "";
  for(const id of ids){
    const a = ae[id];
    const remain = Math.max(0, a.expiresAt - Date.now());
    const s = Math.ceil(remain/1000);
    const div = document.createElement("div");
    div.className = "active-event";
    div.innerHTML = `${a.name} <span class="ev-time">${s}s</span>`;
    wrap.appendChild(div);
  }
}

function fmtDuration(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  if(h>0) return h+"h "+m+"min";
  if(m>0) return m+"min "+sec+"s";
  return sec+"s";
}

function showOfflineToast(offlineMs, gold){
  const ov = document.createElement("div");
  ov.className = "offline-toast";
  ov.innerHTML = `
    <div class="of-banner">PENDANT TON ABSENCE</div>
    <div class="of-time">${fmtDuration(offlineMs)}</div>
    <div class="of-text">Le cabinet a continué de murmurer. La poussière a brillé. L'étincelle s'est rechargée.</div>
    <div class="of-gain">+${gold} <svg viewBox="0 0 16 16" shape-rendering="crispEdges" style="width:11px;height:11px;vertical-align:-2px"><rect x="3" y="5" width="10" height="2" fill="#c9a25a"/><rect x="3" y="7" width="10" height="5" fill="#9a7842"/></svg></div>
    <div class="of-close">Toucher pour fermer</div>
  `;
  document.body.appendChild(ov);
  ov.addEventListener("click", ()=>{ ov.classList.remove("show"); setTimeout(()=>ov.remove(), 600); });
  setTimeout(()=>ov.classList.add("show"), 30);
  if(A.ctx){
    blip(440, .25, "sine", .18, .6);
    setTimeout(()=>blip(660, .25, "sine", .18, .6), 120);
    setTimeout(()=>blip(880, .35, "triangle", .22, .7), 260);
  }
}

/* ================ SAVE / LOAD ================ */
function save(){
  try{
    const now = Date.now();
    STATE.sessionMs = now - STATE.sessionStartMs;
    STATE.totalPlayMs = (STATE.totalPlayMs||0) + (now - (STATE.lastSaveTime||now));
    STATE.lastSaveTime = now;
    const s = {
      essence:STATE.essence, gold:STATE.gold,
      grid:STATE.grid, nextId:STATE.nextId,
      totals:STATE.totals,
      quests:STATE.quests.map(q=>({id:q.id, claimed:q.claimed})),
      essenceMax:STATE.essenceMax, essenceRegen:STATE.essenceRegen,
      firstReached:STATE.firstReached,
      achievements:STATE.achievements,
      sessionMs:STATE.sessionMs,
      totalPlayMs:STATE.totalPlayMs,
      lastSaveTime:now,
      audio:STATE.audio,
    };
    localStorage.setItem("alchimia.save", JSON.stringify(s));
  }catch(e){}
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem("alchimia.save")||"null");
    if(!s) return;
    STATE.essence = s.essence ?? STATE.essence;
    STATE.gold = s.gold ?? 0;
    STATE.grid = s.grid ?? STATE.grid;
    STATE.nextId = s.nextId ?? 1;
    STATE.totals = s.totals ?? STATE.totals;
    STATE.essenceMax = s.essenceMax ?? STATE.essenceMax;
    STATE.essenceRegen = s.essenceRegen ?? STATE.essenceRegen;
    STATE.firstReached = s.firstReached ?? [0,0,0];
    STATE.achievements = s.achievements ?? {};
    STATE.totalPlayMs = s.totalPlayMs ?? 0;
    STATE.audio = s.audio ?? true;

    // Calcul du temps offline
    const now = Date.now();
    const lastSave = s.lastSaveTime || now;
    const offlineMs = Math.max(0, now - lastSave);
    if(offlineMs > 60*1000){ // au-delà d'1 min on parle d'offline
      STATE.lastOfflineMs = offlineMs;
      // Récupération offline : essence se remplit + petit gain de couronnes proportionnel
      STATE.essence = STATE.essenceMax;
      const cappedHours = Math.min(8, offlineMs / (3600*1000)); // cap 8h
      const offlineGold = Math.floor(cappedHours * 12 + (cappedHours * (sumProduced(STATE)/100)));
      STATE.gold += offlineGold;
      STATE.pendingOfflineToast = { ms: offlineMs, gold: offlineGold };
    }
    STATE.sessionStartMs = now;
    STATE.lastSaveTime = now;

    rebuildQuests();
    if(s.quests){
      for(const q of s.quests){
        const t = STATE.quests.find(x=>x.id===q.id);
        if(t) t.claimed = q.claimed;
      }
    }
  }catch(e){}
}

/* ================ BOOT ================ */
function boot(){
  resize();
  initDust();
  buildGrid();
  rebuildQuests();
  load();
  applyProgressionBonuses();
  renderGenerators();
  renderAll();
  refreshQuests();
  renderCodex();
  checkAchievements();
  // Offline progress toast (déclenché dans le start-btn pour éviter d'apparaître avant l'intro)

  document.getElementById("quest-toggle").addEventListener("click", ()=>{
    document.getElementById("quests").classList.toggle("open");
    document.getElementById("codex").classList.remove("open");
  });
  document.getElementById("codex-toggle").addEventListener("click", ()=>{
    document.getElementById("codex").classList.toggle("open");
    document.getElementById("quests").classList.remove("open");
  });
  document.getElementById("audio-toggle").addEventListener("click", ()=>{
    STATE.audio = !STATE.audio;
    if(A.master) A.master.gain.value = STATE.audio ? .35 : 0;
    document.getElementById("audio-toggle").classList.toggle("on", STATE.audio);
  });
  document.getElementById("audio-toggle").classList.toggle("on", STATE.audio);

  document.getElementById("stats-toggle").addEventListener("click", ()=>{
    const m = document.getElementById("stats-modal");
    renderStatsBody();
    m.classList.add("show");
  });
  document.getElementById("stats-close").addEventListener("click", ()=>{
    document.getElementById("stats-modal").classList.remove("show");
  });
  document.getElementById("stats-modal").addEventListener("click", e=>{
    if(e.target.id === "stats-modal") document.getElementById("stats-modal").classList.remove("show");
  });

  document.getElementById("start-btn").addEventListener("click", ()=>{
    document.getElementById("intro").classList.add("gone");
    audioInit();
    if(A.ctx && A.ctx.state === "suspended") A.ctx.resume();
    startDrone();
    // Affiche toast offline si applicable
    if(STATE.pendingOfflineToast){
      const p = STATE.pendingOfflineToast;
      setTimeout(()=>showOfflineToast(p.ms, p.gold), 700);
      STATE.pendingOfflineToast = null;
    }
  });

  // boucle principale
  let last = performance.now();
  let lastEventTickRender = 0;
  function loop(now){
    const dt = (now - last)/1000; last = now;
    STATE.essence = Math.min(STATE.essenceMax, STATE.essence + STATE.essenceRegen * (STATE.eventRegenMul || 1) * dt);
    renderStats();
    tickGenerators(now);
    tickDust();
    tickCandles(now);
    tickFX();
    tickCinema();
    tickEvents(now);
    if(now - lastEventTickRender > 250){ renderActiveEvents(); lastEventTickRender = now; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  setInterval(save, 4000);
  window.addEventListener("beforeunload", save);
}

window.addEventListener("DOMContentLoaded", boot);
</script>
