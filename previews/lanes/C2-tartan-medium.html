<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanes C2 — Tartan contraste moyen</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0d12;color:#fff;font-family:Nunito,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
h1{font-size:16px;margin:0 0 4px}
.tag{font-size:11px;color:#a89880;margin-bottom:10px}
.frame{width:360px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.5);background:#7ec4ee}
canvas{display:block;width:100%;height:100%}
.desc{margin-top:10px;max-width:340px;font-size:12px;color:#c8b8a0;line-height:1.4}
</style></head><body>
<h1>C2 · Tartan contraste MOYEN</h1>
<div class="tag">Bandes rouge vif / rouge brique foncée</div>
<div class="frame"><canvas id="cv" width="360" height="640"></canvas></div>
<div class="desc">Contraste plus visible, couloirs bien distincts mais cohérents.</div>

<script src="_shared.js"></script>
<script>
SCENE_TEMPLATE(document.getElementById('cv'), function drawLanes(ctx, W, H){
  // Rouge vif clair vs brique très foncé
  const colors = ['#f06048', '#a02818', '#f06048', '#a02818', '#f06048'];
  for(let lane = 0; lane < 5; lane++){
    ctx.fillStyle = colors[lane];
    ctx.fillRect(0, H * .58 + lane * 38 + 2, W, 36);
  }
  ctx.fillStyle = '#fff';
  for(let lane = 0; lane <= 5; lane++){
    ctx.fillRect(0, H * .58 + lane * 38, W, 1.5);
  }
});
</script>
</body></html>
