<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1a1814;color:#fff;font-family:Nunito,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}

.desc{margin-top:18px;max-width:360px;font-size:13px;color:#c8b8a0;line-height:1.5}

</style></head><body>
<h1>A · Eatventure cartoon SVG</h1>
<div class="tag">Couleurs vives flat + outlines noires + persos ronds mignons</div>
<div class="frame">
<svg viewBox="0 0 320 340" preserveAspectRatio="xMidYMid meet">

  <!-- Soleil -->

  <circle cx="280" cy="28" r="22" fill="#fff3b0" opacity=".35"/>
  <!-- Nuages -->
  <ellipse cx="50" cy="25" rx="18" ry="5" fill="#fff"/>
  <ellipse cx="62" cy="22" rx="10" ry="4" fill="#fff"/>
  <ellipse cx="160" cy="18" rx="22" ry="5" fill="#fff"/>
  <!-- Herbe -->
  <rect x="0" y="60" width="320" height="280" fill="#88cc4a"/>
  <!-- Stade tribune avec outline noire -->
  <ellipse cx="160" cy="210" rx="150" ry="100" fill="#a85820" stroke="#2a1008" stroke-width="2.5"/>
  <ellipse cx="160" cy="208" rx="148" ry="98" fill="#e89858"/>
  <ellipse cx="160" cy="200" rx="146" ry="92" fill="none" stroke="#fac890" stroke-width="2" opacity=".7"/>
  <!-- Gradins concentriques -->
  <ellipse cx="160" cy="210" rx="135" ry="85" fill="none" stroke="#7a3810" stroke-width=".8" opacity=".55"/>

  <!-- Foule (bonhommes mignons) -->
  <g id="crowd"></g>
  <!-- Bandeau FOULÉE -->
  <path d="M 70,160 L 250,160 L 245,166 L 75,166 Z" fill="#2c6090" stroke="#1a3050" stroke-width=".8"/>

  <!-- Piste rouge -->
  <ellipse cx="160" cy="220" rx="118" ry="76" fill="#e44a30" stroke="#3a1010" stroke-width="2"/>
  <ellipse cx="160" cy="198" rx="115" ry="35" fill="#fff" opacity=".15"/>
  <!-- 8 couloirs blancs -->
  <g fill="none" stroke="#fff" stroke-width=".7" opacity=".85">
    <ellipse cx="160" cy="220" rx="114" ry="72"/>
    <ellipse cx="160" cy="220" rx="110" ry="68"/>
    <ellipse cx="160" cy="220" rx="106" ry="64"/>
    <ellipse cx="160" cy="220" rx="102" ry="60"/>
    <ellipse cx="160" cy="220" rx="98" ry="56"/>
    <ellipse cx="160" cy="220" rx="94" ry="52"/>
    <ellipse cx="160" cy="220" rx="90" ry="48"/>
  </g>
  <!-- Gazon central -->
  <ellipse cx="160" cy="220" rx="88" ry="46" fill="#9ec858" stroke="#2a1808" stroke-width="1.8"/>
  <!-- Podium -->
  <g>
    <rect x="143" y="222" width="9" height="5" fill="#c8c8d4" stroke="#3a2818" stroke-width=".5"/>
    <rect x="153" y="218" width="9" height="9" fill="#ffd84a" stroke="#3a2818" stroke-width=".5"/>
    <rect x="163" y="224" width="9" height="3" fill="#d4884a" stroke="#3a2818" stroke-width=".5"/>
    <text x="157.5" y="225" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="4.5" fill="#3a2818">1</text>
  </g>
  <!-- Coureurs cartoon round (cute) -->
  <g transform="translate(160 270) scale(3)">
    <ellipse cx="0" cy="3.5" rx="2.5" ry=".5" fill="#000" opacity=".25"/>
    <rect x="-1.2" y="0" width="1" height="3" rx=".5" fill="#f0d4b0"/>
    <rect x=".2" y="0" width="1" height="3" rx=".5" fill="#f0d4b0"/>
    <ellipse cx="-.7" cy="3" rx=".8" ry=".4" fill="#e85040"/>
    <ellipse cx=".7" cy="3" rx=".8" ry=".4" fill="#e85040"/>
    <rect x="-1.5" y="-2" width="3" height="2.5" rx="1" fill="#e85040"/>
    <ellipse cx="0" cy="-3.5" rx="1.6" ry="1.6" fill="#f0d4b0"/>
    <path d="M -1.6,-4.5 Q -1.6,-5.5 0,-5.4 Q 1.6,-5.5 1.6,-4.5 Q 1.6,-3.7 1,-3.5 L -1,-3.5 Q -1.6,-3.7 -1.6,-4.5 Z" fill="#7a5838"/>

    <rect x="14" y="118" width="2" height="32"/>
    <rect x="304" y="118" width="2" height="32"/>
    <rect x="14" y="240" width="2" height="38"/>
    <rect x="304" y="240" width="2" height="38"/>

  <g fill="#ffd84a" stroke="#3a2818" stroke-width="1.2">
    <circle cx="15" cy="116" r="6"/>

</div>
<div class="desc"><b>+</b> Cohérent, mignon, identité claire. Simple à maintenir. Outlines noires donnent du caractère.<br><b>−</b> "Cartoon basic" peut sembler cheap selon les goûts. Pas premium.</div>
<script>
// Génère 60 bonhommes de foule
const crowd = document.getElementById('crowd');
const colors = ['#e84a30','#4a9fd9','#7ec46a','#ffd060','#e85aa0','#9080c0','#fff'];
const skins = ['#f0d4b0','#e0c098','#d0a880','#c09068'];
const cx = 160, cy = 210;
let html = '';
for(let r = 0; r < 3; r++){
  const rx = 144 - r * 10, ry = 92 - r * 6;
  const n = 20 + r * 2;
  for(let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2;
    const x = cx + Math.cos(a) * rx;
    const y = cy + Math.sin(a) * ry;
    const c = colors[(i+r) % colors.length];
    const s = skins[i % skins.length];
    const size = 1.7 + r * .2;
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}" fill="${c}"/>`;
    html += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(size*.65).toFixed(1)}" fill="${s}"/>`;
  }
}
crowd.innerHTML = html;
</script>
</body></html>
