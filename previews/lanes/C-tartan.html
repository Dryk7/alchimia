<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lanes C — Tartan officiel</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0d12;color:#fff;font-family:Nunito,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
h1{font-size:16px;margin:0 0 4px}
.tag{font-size:11px;color:#a89880;margin-bottom:10px}
.frame{width:360px;aspect-ratio:9/16;border-radius:18px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.5);background:#7ec4ee}
canvas{display:block;width:100%;height:100%}
.desc{margin-top:10px;max-width:340px;font-size:12px;color:#c8b8a0;line-height:1.4}
</style></head><body>
<h1>C · Tartan officiel</h1>
<div class="tag">Bandes alternées couleurs piste + lignes blanches fines de séparation</div>
<div class="frame"><canvas id="cv" width="360" height="640"></canvas></div>
<div class="desc">+ Look "Mondo" pro, riche, identité athlé forte. − Plus chargé visuellement.</div>

<script src="_shared.js"></script>
<script>
SCENE_TEMPLATE(document.getElementById('cv'), function drawLanes(ctx, W, H, t, speed, pal){
  // Bandes alternées sur les 5 couloirs (lighter + darker)
  const lanes = [
    { color: '#e85040' },  // rouge clair
    { color: '#c84030' },  // rouge mid
    { color: '#e85040' },
    { color: '#c84030' },
    { color: '#e85040' },
  ];
  for(let lane = 0; lane < 5; lane++){
    const y = H * .58 + (lane * 38);
    ctx.fillStyle = lanes[lane].color;
    ctx.fillRect(0, y + 2, W, 36); // entre les lignes
  }
  // Lignes blanches fines de séparation
  ctx.fillStyle = '#fff';
  for(let lane = 0; lane <= 5; lane++){
    const y = H * .58 + (lane * 38);
    ctx.fillRect(0, y, W, 1.5);
  }
});
</script>
</body></html>
